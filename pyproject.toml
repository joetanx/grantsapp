[project]
name = "scamintel"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Core web & validation
    "aiohttp>=3.10,<4",
    "pydantic>=2.0,<3",

    # PostgreSQL driver
    "psycopg[binary]>=3.2,<4",

    # Azure SDK components
    "azure-core>=1.30,<2",
    "azure-identity>=1.18,<2",
    "azure-monitor-ingestion>=1.0,<2",
    "azure-monitor-query>=1.3,<2",

    # Enrichment lookups
    "dnspython>=2.6,<3",
    "requests>=2.32,<3",

    # LangChain / LangGraph SDK and MCP adapter
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langchain-azure-ai>=1,<2",
    "langchain-mcp-adapters>=0.1,<1",
    "langgraph>=1,<2",

    # Microsoft Agents SDK - Official packages for hosting and integration
    "microsoft-agents-activity>=0.7,<1",
    "microsoft-agents-hosting-aiohttp>=0.7,<1",
    "microsoft-agents-hosting-core>=0.7,<1",
    "microsoft-agents-authentication-msal>=0.7,<1",
    "microsoft-agents-a365-notifications>=1,<3",

    # Observability using Microsoft OpenTelemetry
    "microsoft-opentelemetry",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]
