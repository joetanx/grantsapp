[project]
name = "grantsapp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "psycopg[binary]",
    "azure-identity",
    "langchain",
    "langchain-azure-ai",
    "langgraph",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
