location: ${LOCATION}
resourceGroup: ${RG}
name: ${APP_NAME}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ${UAMI_RSC_ID}: {}
properties:
  managedEnvironmentId: ${CAE_ID}
  configuration:
    secrets:
      - name: keenable-api-key
        value: "${KEENABLE_API_KEY}"
      - name: tavily-api-key
        value: "${TAVILY_API_KEY}"
      - name: telegram-bot-token
        value: "${TELEGRAM_BOT_TOKEN}"
      - name: telegram-webhook-secret
        value: "${TELEGRAM_WEBHOOK_SECRET}"
    registries:
      - server: ${ACR_NAME}.azurecr.io
        identity: ${UAMI_RSC_ID}
    ingress:
      external: true
      allowInsecure: false
      targetPort: 8080
      transport: auto
  template:
    volumes:
      - name: ${APP_NAME}-vol
        storageType: NfsAzureFile
        storageName: ${APP_NAME}
    containers:
      - name: ${APP_NAME}
        image: ${ACR_NAME}.azurecr.io/${APP_NAME}:latest
        volumeMounts:
          - volumeName: ${APP_NAME}-vol
            mountPath: /app
        resources:
          cpu: 0.5
          memory: 1Gi
        probes:
          - type: Startup
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          - type: Readiness
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          - type: Liveness
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
        env:
          # Listener for aiohttp.web run_app
          - name: HOST
            value: "0.0.0.0"
          - name: PORT
            value: "8080"
          - name: LOG_LEVEL
            value: "INFO"

          # LangChain / Azure AI Foundry model connection
          - name: FOUNDRY_PROJECT_ENDPOINT
            value: "${FOUNDRY_PROJECT_ENDPOINT}"
          - name: FOUNDRY_MODEL
            value: "${FOUNDRY_MODEL}"
          - name: UAMI_CLIENT_ID
            value: "${UAMI_CLIENT_ID}"

          # Agent blueprint connection settings (M365 Agents SDK / Entra Agent User)
          - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHORITY
            value: "https://login.microsoftonline.com/${TENANT_ID}"
          - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHTYPE
            value: FederatedCredentials
          - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID
            value: "${BLUEPRINT_CLIENT_ID}"
          - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__FEDERATEDCLIENTID
            value: "${UAMI_CLIENT_ID}"
          - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__TENANTID
            value: "${TENANT_ID}"

          # Agent identity and user IDs
          - name: AGENTIC_INSTANCE_ID
            value: "${AGENTIC_INSTANCE_ID}"
          - name: AGENTIC_USER_ID
            value: "${AGENTIC_USER_ID}"

          # Azure PostgreSQL (Entra Agent User auth via get_agent_user_token)
          - name: PGHOST
            value: "${PGHOST}"
          - name: PGPORT
            value: "5432"
          - name: PGDATABASE
            value: "${PGDATABASE}"
          - name: PGUSER
            value: "${PGUSER}"
          - name: PGSSLMODE
            value: "require"

          # Azure Monitor / Microsoft Sentinel (Log Analytics + DCR/DCE)
          - name: LOG_ANALYTICS_WORKSPACE_ID
            value: "${LOG_ANALYTICS_WORKSPACE_ID}"
          - name: DCE_ENDPOINT
            value: "${DCE_ENDPOINT}"
          - name: DCR_IMMUTABLE_ID
            value: "${DCR_IMMUTABLE_ID}"
          - name: DCR_STREAM_NAME
            value: "Custom-ScamIntel_CL"

          # External search APIs
          - name: KEENABLE_API_KEY
            secretRef: keenable-api-key
          - name: TAVILY_API_KEY
            secretRef: tavily-api-key

          # Telegram intake webhook
          - name: TELEGRAM_BOT_TOKEN
            secretRef: telegram-bot-token
          - name: TELEGRAM_WEBHOOK_SECRET
            secretRef: telegram-webhook-secret
    scale:
      minReplicas: 1
      maxReplicas: 1
